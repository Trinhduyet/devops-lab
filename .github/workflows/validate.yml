name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  repository-checks:
    name: Repository validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1 pinned to its verified full commit SHA.
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Required documentation, Bash syntax and tracked-path gates
        run: ./scripts/validate.sh repo

      - name: Exercise evidence freshness, provenance and duplicate-key checks
        run: bash scripts/tests/test-validator-evidence.sh

      - name: Install pinned ShellCheck package
        run: |
          sudo apt-get update
          sudo apt-get install --allow-downgrades --yes --no-install-recommends shellcheck=0.9.0-1
          shellcheck --version | grep -F 'version: 0.9.0'

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Install pinned Gitleaks release
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error "$url" --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan all reachable commit diffs with redaction
        run: |
          set -euo pipefail
          reachable_count="$(git rev-list --all --count)"
          if [[ ! "$reachable_count" =~ ^[1-9][0-9]*$ ]]; then
            printf 'FAIL: no commits were reachable from the fetched Git refs.\n' >&2
            exit 1
          fi
          expected_text_count="$(git log --all --full-history --diff-merges=first-parent --diff-filter=d --format='COMMIT:%H' --numstat | awk '
            /^COMMIT:/ { if (in_commit && has_text_additions) count++; in_commit=1; has_text_additions=0; next }
            NF >= 3 && $1 != "-" && $1 + 0 > 0 { has_text_additions=1 }
            END { if (in_commit && has_text_additions) count++; print count + 0 }
          ')"
          if [[ ! "$expected_text_count" =~ ^[1-9][0-9]*$ || "$expected_text_count" -gt "$reachable_count" ]]; then
            printf 'FAIL: could not derive a valid full-history text-addition count from fetched refs.\n' >&2
            exit 1
          fi
          printf 'Fetched history: reachable commits=%s; commits introducing scannable text=%s.\n' "$reachable_count" "$expected_text_count"
          scan_report="$RUNNER_TEMP/gitleaks-report.json"
          set +e
          scan_output="$(gitleaks git --redact=100 --exit-code=2 --report-format=json --report-path="$scan_report" --log-opts='--all --full-history --diff-merges=first-parent' 2>&1)"
          scan_status=$?
          set -e
          scanned_count="$(grep -Eo '[0-9]+ commits scanned' <<< "$scan_output" | tail -n 1 | awk '{print $1}')"
          if [[ ! "$scanned_count" =~ ^[1-9][0-9]*$ ]]; then
            printf 'FAIL: Gitleaks did not report a non-zero full-history scan count (exit=%s). Output suppressed.\n' "$scan_status" >&2
            exit 1
          fi
          printf 'Gitleaks full-history scan: commits scanned=%s; reachable commits=%s; commits introducing scannable text=%s; exit=%s.\n' "$scanned_count" "$reachable_count" "$expected_text_count" "$scan_status"
          if (( scanned_count < expected_text_count || scanned_count > reachable_count )); then
            printf 'FAIL: Gitleaks scan count is outside the full-history text-diff and reachable-commit bounds.\n' >&2
            exit 1
          fi
          if (( scan_status != 0 )); then
            if [[ -s "$scan_report" ]]; then
              python3 - "$scan_report" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as report_file:
                  findings = json.load(report_file)
          except (OSError, json.JSONDecodeError):
              print("Gitleaks report could not be parsed; finding details suppressed.")
              raise SystemExit(0)

          print("Gitleaks finding count (values suppressed): %s" % len(findings))
          for finding in findings[:10]:
              secret_value = finding.get("Secret", "")
              print("Gitleaks finding: rule=%s file=%s line=%s columns=%s-%s length=%s commit=%s" % (
                  finding.get("RuleID", "unknown"),
                  finding.get("File", "unknown"),
                  finding.get("StartLine", "unknown"),
                  finding.get("StartColumn", "unknown"),
                  finding.get("EndColumn", "unknown"),
                  len(secret_value) if isinstance(secret_value, str) else "unknown",
                  finding.get("Commit", "unknown"),
              ))
          if len(findings) > 10:
              print("Additional Gitleaks findings omitted from safe summary.")
          if not findings:
              print("Gitleaks reported non-zero without findings; scanner details suppressed.")
          PY
            else
              printf 'Gitleaks report unavailable; finding details suppressed.\n'
            fi
            printf 'FAIL: Gitleaks found a policy violation or could not complete the scan; secret-bearing scanner output was suppressed.\n' >&2
            exit "$scan_status"
          fi

  windows-powershell:
    name: PowerShell syntax and remote-helper mocks
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Parse PowerShell scripts
        shell: pwsh
        run: ./scripts/validate-powershell.ps1

      - name: Exercise SSH, SCP, remote-exit and cleanup paths with mocks
        shell: pwsh
        run: ./scripts/tests/test-run-remote.ps1

  dotnet-sample-api:
    name: .NET API build and integration smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 10.0.404

      - name: Build, exercise health endpoints and verify graceful shutdown
        run: ./scripts/test-dotnet-api.sh

  docker-sample-api:
    name: Docker image and container integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build and verify bounded Docker container
        run: ./scripts/test-dotnet-container.sh
