services:
  sample-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOTNET_SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0.404-noble
        DOTNET_ASPNET_IMAGE: mcr.microsoft.com/dotnet/aspnet:10.0.15-noble
    environment:
      APP_NAME: devops-lab-sample-api
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: 192m
    cpus: 0.50
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    stop_grace_period: 15s
